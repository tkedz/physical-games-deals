name: collect

# The collector's four-hourly schedule, carried over unchanged from the
# repository it used to live in, and the deal extractor, which runs right after
# it in the same job. What did not come along is the commit-and-push step: the
# entries go into public.collected_posts now, so there is no data file to push —
# and therefore none of these six daily runs pushes a commit that would trigger
# `verify` plus a production deploy, which no paths-ignore pattern in ci.yml
# would have caught.
on:
  schedule:
    # GitHub disables a scheduled workflow in a repository with no activity for
    # 60 days, and collection would then stop with no failing run to show for
    # it. If this repository ever goes quiet, re-enable it here.
    - cron: "7 */4 * * *"
  workflow_dispatch:

# The write permission existed only for the push step.
permissions:
  contents: read

# A group of its own — deliberately not ci.yml's
# `${{ github.workflow }}-${{ github.ref }}` — so a collection and a CI run that
# overlap in time never cancel each other. Nothing is cancelled in progress
# either: a run already fetching feeds is worth finishing, and the feeds retain
# roughly two days.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Fifteen feeds at the collector's 20-second parser timeout is a ~5 minute
    # worst case. The extractor then stops starting links after RUN_BUDGET_MS,
    # 8 minutes (scripts/extract/config.mts), and lets the calls in flight
    # finish — up to about 6 minutes for one that times out twice at
    # REQUEST_TIMEOUT_MS. Anything beyond this is a hang, not slow feeds or a
    # long backlog.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # .nvmrc rather than a literal version, matching both jobs in ci.yml. It
      # pins Node 24, which runs .mts directly; on Node 22 the same file would
      # need --experimental-strip-types.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # The collector needs rss-parser and supabase-js, and the extractor
      # supabase-js and zod, all in dependencies. Nothing in devDependencies is
      # used here, and leaving that tree out keeps third-party install code out
      # of the job that later holds the OpenRouter key and a key which bypasses
      # row-level security.
      - run: npm ci --omit=dev

      - name: Collect
        id: collect
        env:
          # Both values are read from the environment, so no credential ever
          # appears on a command line the runner echoes into the log — the
          # pattern ci.yml already uses for the Vercel token. Scoped to this
          # step rather than the job: `npm ci` above runs dependency lifecycle
          # scripts, which have no business seeing a key that bypasses
          # row-level security.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # A repository variable rather than a secret: the URL is public and is
          # already inlined into the browser bundle by the Next build.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: npm run collect

      - name: Extract deals
        # Runs after a failed collection too: the backlog can still drain.
        # Setting the repository variable EXTRACT_PAUSED to true skips this step
        # and leaves collection running; deleting the variable resumes it. A
        # skipped run records nothing in public.pipeline_runs, so the deals
        # view's "last refreshed" line keeps the time of the last ok run.
        if: ${{ !cancelled() && vars.EXTRACT_PAUSED != 'true' }}
        env:
          # Scoped to this step, for the reason given on the Collect step: no
          # other step has any business seeing it.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          # How the Collect step ended. Its presence is also what makes the
          # extractor write a public.pipeline_runs row, which a local run never
          # does.
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          # The repository variable EXTRACT_SINCE, when set, limits the run to
          # posts first seen since then: a date (YYYY-MM-DD, from the start of
          # that day in Warsaw) or an instant with its offset. Unset, every
          # pending post is eligible; a value that does not parse fails the step.
          EXTRACT_SINCE: ${{ vars.EXTRACT_SINCE }}
        run: npm run extract
